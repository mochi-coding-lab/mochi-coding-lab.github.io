<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi · First day design preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091d18;color:#f8efd8;font:15px/1.5 system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f1ce88;outline-offset:3px}.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 370px;padding:12px;gap:12px}.scene{position:relative;overflow:hidden;border-radius:22px;background:#15372c}.scene>svg{width:100%;height:100%;display:block}.tag{position:absolute;top:14px;left:14px;padding:8px 13px;border:1px solid #fff3;border-radius:30px;background:#0c2b24ed;font-size:10px;letter-spacing:1.4px}.story{position:absolute;bottom:18px;left:18px;right:18px;max-width:440px;background:#0b2c25ed;border:1px solid #e8d49d55;border-radius:18px;padding:14px 18px;backdrop-filter:blur(10px)}.story small{color:#eac584;font-size:10px;letter-spacing:1.5px}.story p{margin:6px 0 0;font-size:15px}.workspace{overflow:auto;background:#112d24;border:1px solid #c6d4a52b;border-radius:22px;padding:20px}.kicker{color:#d8b675;font-size:10px;letter-spacing:1.5px}.workspace h1{font-size:25px;line-height:1.15;margin:9px 0 12px}.workspace p{color:#c5d3c1;font-size:13px}.stepnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:18px}.stepnav button,.small{border:1px solid #ffffff26;border-radius:10px;background:#ffffff08;padding:7px 10px;font-size:11px}.stepnav select{min-width:0;flex:1;background:#0c241d;color:#f6e8c9;border:1px solid #ffffff26;border-radius:10px;font-size:12px;padding:6px}.concept{border:1px solid #d1b46b44;border-radius:12px;padding:12px;background:#c8a95c09;font-size:12px}.concept strong{color:#efcb82}.choices{display:grid;gap:9px;margin:14px 0}.choices label{font-size:11px;color:#b9cbb7}.choices input,.choices select{display:block;background:#091f19;color:#fff2ce;border:1px solid #b1c5964d;border-radius:9px;padding:8px;width:100%;margin-top:4px}textarea{width:100%;height:165px;resize:vertical;background:#071a13;color:#d8e6bf;border:1px solid #819d7555;border-radius:14px;padding:12px;font:12px/1.6 ui-monospace,monospace;tab-size:4}button.primary{background:linear-gradient(#f3d18a,#d7a64e);color:#302712;border:0;border-radius:12px;padding:12px;width:100%;font-weight:750;margin:9px 0}.status{min-height:24px;color:#b9ddad;font-size:12px}.notice{font-size:11px!important;color:#a8b7a4!important;border-top:1px solid #ffffff18;padding-top:12px}.review{display:flex;gap:8px;margin-top:12px}.review>*{flex:1}svg text{font-family:system-ui}#crops text{font-size:27px}#gate{transform-box:fill-box;transform-origin:left;transition:transform .6s}#gate.open{transform:skewY(-17deg) scaleX(.35)}.glow{filter:drop-shadow(0 0 14px #f4d888)}@media(min-width:760px) and (max-width:1199px){.app{grid-template-columns:1fr;grid-template-rows:62dvh minmax(0,1fr)}.workspace{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}.stepnav{grid-column:1/-1;margin-bottom:8px}.right{grid-column:2;grid-row:2/8}.workspace h1{font-size:21px}.choices{margin:7px 0}.notice{margin:5px 0}textarea{height:120px}}@media(max-width:759px){.app{display:flex;flex-direction:column;padding:0;gap:0}.scene{height:46dvh;min-height:46dvh;border-radius:0}.workspace{flex:1;border-radius:22px 22px 0 0;padding:16px;overflow:auto}.story{bottom:12px;left:12px;right:12px;padding:9px 12px}.story p{font-size:12px}.tag{font-size:8px;padding:6px 10px;top:10px;left:10px}.stepnav{margin-bottom:10px}.workspace h1{font-size:23px}textarea{height:130px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</svg><div class="tag">MOCHI · FIRST DAY · DESIGN PREVIEW</div><div class="story"><small id="chapter"></small><p id="story"></p></div></section>
<section class="workspace"><nav class="stepnav" aria-label="Preview activities"><button id="prev" aria-label="Previous activity">←</button><select id="activity" aria-label="Choose activity"></select><button id="next" aria-label="Next activity">→</button></nav><div class="left"><div class="kicker" id="number"></div><h1 id="title"></h1><p id="task"></p><div class="concept"><strong>WHAT YOU LEARN</strong><div id="learn"></div></div><div class="choices" id="choices"></div></div><div class="right"><label class="kicker" for="code">PROPOSED CODE / WORKSPACE</label><textarea id="code" spellcheck="false" aria-describedby="disclaimer"></textarea><button class="primary" id="preview">Preview farm response ✦</button><div class="status" id="status" role="status"></div><div class="review"><button class="small" id="before">Before action</button><button class="small" id="after">After action</button></div><p class="notice" id="disclaimer">Interactive design mockup. Buttons simulate proposed outcomes; this page does not execute Python. Added objects and soil overlays are schematic, not final artwork. Game commands shown are proposed APIs.</p></div></section></div>
<script>
const steps=[
['A new beginning','Meet your farm workbench','Find out how Python will help you wake up this little farm.','Python features, interpreter, IDE/IDLE and development tools.','Welcome to the farm. A little code will help us begin.','# Python tells our farm what to do.\n# Explore: IDLE · PyCharm · Spyder · Jupyter','The workbench is ready. Short learning cards explain Python and its tools.'],
['Through the gate','Open the entrance','Try one instruction in the interactive shell. The >>> prompt is displayed by the interface.','Interactive mode, immediate execution, parentheses and case sensitivity.','The gate is closed. Let’s step inside.','gate.open()','The proposed gate opens and Mochi steps inside.'],
['A friendly hello','Welcome the visitors','Choose a greeting and let Mochi say it to the farm’s first visitors.','print(), strings, quotes and visible output.','What shall we say to our first visitors?','print("Welcome to our farm!")','Your greeting appears as Mochi’s speech.'],
['Make it yours','Name your farm','Store a name, print a welcome, then paint your sign using the proposed farm command.','String variables, assignment, use-before-assignment and print with multiple items.','This place needs a name of its own.','farm_name = "Sunny Brook"\nprint("Welcome to", farm_name)\nfarm.set_name(farm_name)','The sign now carries your chosen farm name.'],
['Everything in its place','Label the supplies','Choose a useful variable name for your seed supply. Compare it with invalid examples.','Identifiers, underscores/digits, case sensitivity and reserved keywords.','A good label makes our supplies easy to find.','seed_count = 12\n# Try comparing: seed_count, 1seed, for\n# The last two are invalid variable names.','Your chosen supply label is shown on the chest.'],
['Pick your first crop','Stock the seed chest','Choose your crop and how many seeds to bring. Revisit your values to try a different plan.','Strings, integers, assignment and reassignment.','Carrots, sunflowers or tomatoes—which will you grow?','crop = "carrot"\nseed_count = 12\nfarm.stock(crop, seed_count)','The chest shows your crop and seed quantity.'],
['Room to grow','Measure your garden','Choose the bed dimensions. Use multiplication to calculate how many planting spaces it holds.','Numeric variables, expressions and rectangle area.','How much room shall we prepare for our plants?','length = 4\nbreadth = 3\narea = length * breadth\nprint("Garden area is", area)','Measurement lines show your chosen dimensions and area.'],
['Your first garden bed','Prepare the ground','Turn an unprepared patch into a planting bed using your chosen dimensions.','Use calculated values as arguments to a proposed game function.','This ground is waiting for its first garden.','farm.prepare_bed(length, breadth)','The natural patch becomes a prepared bed. Overlay art is provisional.'],
['Seeds of possibility','Plant your chosen seeds','Plant your crop in the new bed. The available spaces and seed supply limit how many you can plant.','Reuse variables and pass values to functions.','Our prepared bed is ready for seeds.','farm.plant(crop, seed_count)','Planted positions appear; the supply display shows remaining seeds.'],
['A routine to keep','Save your first morning','Save several instructions as morning.py, then run them together. Comments explain your plan.','Script mode, .py files, comments, execution order; indentation introduction.','Let’s turn our first morning into a routine we can repeat.','# Our first morning\nfarm.prepare_bed(length, breadth)\nfarm.plant(crop, seed_count)\nfarm.water()','Preview of the routine’s final state: watered soil and growing plants.'],
['Behind the labels','Inspect a stored value','Explore how names refer to values. A finished version would show actual Python object identity.','Objects, references, function arguments and id().','Our variable names point to values Python remembers.','crop = "carrot"\nprint(crop)\nprint(id(crop))','The inspector represents a stored value. No fake Python ID is generated.'],
['Your first day, remembered','Open the farm notebook','Review your first-day choices in notebook cells, then explore the take-home setup guide.','Jupyter cells, .ipynb vs .py, Python/Anaconda installation and recap.','The farm is ready. Your notebook keeps the story of its first day.','# Cell 1: choose a crop\ncrop = "carrot"\n\n# Cell 2: inspect your choice\nprint(crop)\n\n# Guide: python.org · anaconda.com','Notebook layout concept and first-day completion. Installation is guided, not performed.']
];
let index=0;let state={name:'Sunny Brook',crop:'carrot',seeds:12,length:4,breadth:3,greeting:'Welcome to our farm!',label:'seed_count'};let after=false;
const $=id=>document.getElementById(id),show=(id,on)=>$(id).style.display=on?'':'none';
steps.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s[1]}`;$('activity').append(o)});
function input(label,key,type='text',min=1,max=24){let l=document.createElement('label');l.textContent=label;let el=document.createElement('input');el.type=type;el.value=state[key];if(type==='number'){el.min=min;el.max=max}el.oninput=()=>{state[key]=type==='number'?Math.max(min,Math.min(max,Number(el.value)||min)):el.value.slice(0,35);draw()};l.append(el);$('choices').append(l)}
function cropSelect(){let l=document.createElement('label');l.textContent='Your crop';let e=document.createElement('select');['carrot','sunflower','tomato'].forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;o.selected=c===state.crop;e.append(o)});e.onchange=()=>{state.crop=e.value;draw()};l.append(e);$('choices').append(l)}
function render(){after=false;const s=steps[index];$('activity').value=index;$('number').textContent=`ACTIVITY ${index+1} OF 12`;$('chapter').textContent=s[0].toUpperCase();$('title').textContent=s[1];$('task').textContent=s[2];$('learn').textContent=s[3];$('story').textContent=s[4];$('code').value=s[5];$('status').textContent='Choose Preview farm response to inspect this concept.';$('choices').replaceChildren();if(index===2)input('Mochi’s greeting','greeting');if(index===3)input('Your farm name','name');if(index===4)input('Supply variable name','label');if([5,8].includes(index)){cropSelect();input('Seed quantity','seeds','number',1,24)}if([6,7].includes(index)){input('Length (spaces)','length','number',1,6);input('Width (spaces)','breadth','number',1,4)}draw()}
function bedPoint(u,v){return {x:(1-v)*(460+212*u)+v*(624+182*u),y:(1-v)*(336-43*u)+v*(420-50*u)}}
function draw(){const n=index,done=after;show('gate',n<=1);$('gate').classList.toggle('open',n===1&&done);$('mochi').setAttribute('x',n<=1&&!done?'745':'760');$('mochi').setAttribute('y',n===1&&done?'485':'560');show('sign',n>=3);$('farmSign').textContent=n>3||done?state.name:'Your farm name';show('supplies',n>=4);$('supplyText').textContent=n===4?(done?state.label:'Supplies'):n>=8&&done?`${Math.max(0,state.seeds-state.length*state.breadth)} seeds left`:`${state.seeds} ${state.crop} seeds`;show('plot',n>=6);$('soil').setAttribute('fill',n>=8||(n===7&&done)?'#59452f':'#80734b');show('grid',n===6&&done||n===7&&done);$('grid').replaceChildren();for(let axis=0;axis<2;axis++){let count=axis?state.breadth:state.length;for(let i=1;i<count;i++){let a=axis?bedPoint(0,i/count):bedPoint(i/count,0),b=axis?bedPoint(1,i/count):bedPoint(i/count,1);let line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',`M${a.x} ${a.y}L${b.x} ${b.y}`);$('grid').append(line)}}$('bedLabel').textContent=n===6&&done?`${state.length} × ${state.breadth} = ${state.length*state.breadth} spaces`:'';show('water',n===9&&done);show('speech',n===2&&done||n===11&&done);$('speechText').textContent=n===11?'Our first day is ready!':state.greeting;show('inspect',n===10&&done);$('inspectText').textContent=`Stored value: ${state.crop}`;$('crops').replaceChildren();if(n>=9||(n===8&&done)){let count=Math.min(state.seeds,state.length*state.breadth);for(let i=0;i<count;i++){let t=document.createElementNS('http://www.w3.org/2000/svg','text');let point=bedPoint(((i%state.length)+.5)/state.length,(Math.floor(i/state.length)+.5)/state.breadth);t.setAttribute('x',point.x-13);t.setAttribute('y',point.y+9);t.textContent=done&&n>=9?({carrot:'🥕',sunflower:'🌻',tomato:'🍅'}[state.crop]):'🌱';$('crops').append(t)}}}
function result(){after=true;draw();$('status').textContent=steps[index][6]}
$('preview').onclick=result;$('after').onclick=result;$('before').onclick=()=>{after=false;draw();$('status').textContent='Before this activity’s action.'};$('next').onclick=()=>{index=(index+1)%steps.length;render()};$('prev').onclick=()=>{index=(index+steps.length-1)%steps.length;render()};$('activity').onchange=e=>{index=Number(e.target.value);render()};render();
</script></html>

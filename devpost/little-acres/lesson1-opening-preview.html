<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi · A gentler first lesson</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b201a;color:#fff2d5;font:15px/1.6 system-ui}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #e4c67c;outline-offset:3px}.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;padding:12px;height:100dvh}.farm{position:relative;border-radius:22px;overflow:hidden;background:#1b3c2b}.farm svg{width:100%;height:100%;display:block}.top{position:absolute;left:16px;top:16px;background:#102e25ed;border:1px solid #fff3;border-radius:30px;padding:8px 13px;font-size:10px;letter-spacing:1.4px}.speech{position:absolute;left:18px;right:18px;bottom:18px;max-width:450px;padding:15px 18px;border-radius:18px;background:#102d24ed;border:1px solid #e5c77d66}.speech small{color:#e3c580;letter-spacing:1.4px;font-size:10px}.speech p{margin:6px 0 0}.panel{border:1px solid #c4d3ac33;border-radius:22px;background:#123025;padding:23px;overflow:auto}.kicker{color:#e5c784;font-size:10px;letter-spacing:1.4px}h1{font-size:28px;line-height:1.15;margin:10px 0 16px}p{color:#c9d6c1;font-size:14px}.goals{padding:14px;background:#0a231b;border-radius:14px;display:grid;gap:11px;margin:18px 0}.goal span{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid #dac08066;border-radius:50%;color:#e9cb86;font-size:12px;margin-right:7px}.example{background:#071d15;border:1px solid #9dbd8955;border-radius:14px;padding:17px;color:#ffe4a4;font:16px/1.6 ui-monospace,monospace;margin:15px 0}.explain{display:grid;gap:10px;font-size:13px}.explain strong{color:#e7c780}.explain div{padding-bottom:8px;border-bottom:1px solid #ffffff16}.task{background:#d4b9750c;border:1px solid #e0bf6a55;border-radius:14px;padding:12px;margin:16px 0}.task strong{color:#e2c27c;font-size:10px;letter-spacing:1.2px}.task p{margin:4px 0}.primary{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(#f4d28b,#dbad56);color:#302913;font-weight:750;margin-top:14px}.secondary{background:none;border:1px solid #fff3;border-radius:10px;color:#e3d8b8;padding:8px 12px;font-size:12px;margin:10px 0}.field{display:block;color:#c9d7c0;font-size:11px;margin-bottom:7px}textarea{width:100%;height:112px;background:#071d15;border:1px solid #a0bc8b77;border-radius:12px;padding:14px;color:#fff1c9;font:15px/1.6 ui-monospace,monospace;resize:vertical}.error{color:#ffd0a1;font-size:13px;min-height:24px;margin-top:8px}.note{font-size:11px;color:#a7bca4;border-top:1px solid #fff2;padding-top:12px;margin-top:22px}.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:11px;color:#b9cbb0}.nav button{background:transparent;border:1px solid #fff3;color:#ecdfbc;border-radius:8px;padding:5px 9px}.success{border:1px solid #93b77b66;border-radius:14px;padding:14px;background:#779e5c15}.success strong{color:#d9e8b4}#board{transition:opacity .3s}#mochi{transition:x .7s,y .7s}a{color:#ebca83}@media(min-width:760px) and (max-width:1199px){.app{grid-template-columns:1fr;grid-template-rows:62dvh minmax(0,1fr)}.panel{padding:18px}.panel h1{font-size:23px}}@media(max-width:759px){.app{display:flex;flex-direction:column;gap:0;padding:0}.farm{height:46dvh;min-height:46dvh;border-radius:0}.panel{flex:1;border-radius:20px 20px 0 0;padding:17px;overflow:auto}.speech{bottom:12px;left:12px;right:12px;padding:10px 13px}.speech p{font-size:12px}.speech small,.top{font-size:8px}.top{left:10px;top:10px}h1{font-size:24px}.goals{margin:12px 0}.nav{margin-bottom:9px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><div class="app"><section class="farm"><svg viewBox="0 0 1600 1067" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mochi’s farm and the welcome-message preview"><image href="art/restoration-shell-1600.webp" width="1600" height="1067"/><g id="board"><path d="M1090 490V600" stroke="#856242" stroke-width="12"/><rect x="920" y="398" width="340" height="115" rx="13" fill="#705335" stroke="#c8a774" stroke-width="7"/><text id="message" x="1090" y="446" text-anchor="middle" font-size="20" font-family="system-ui" fill="#fff2cc"></text><text id="message2" x="1090" y="477" text-anchor="middle" font-size="20" font-family="system-ui" fill="#fff2cc"></text></g><image id="mochi" href="art/play-mochi-512.webp" x="799" y="631" width="130" height="116"/></svg><div class="top">MOCHI · OUR FIRST MORNING</div><div class="speech"><small>MOCHI</small><p id="mochiWords"></p></div></section><aside class="panel"><nav class="nav"><button id="back">← Back</button><span id="progress"></span><button id="restart">Restart</button></nav><div id="content"></div><p class="note">Design preview · Only a single print statement with plain quoted text is supported here. Full lesson, artwork changes and Python execution are not implemented.</p></aside></div>
<script>
let step=0,message='',draft='print("...")',freeDraft='';const $=id=>document.getElementById(id);const words=['This farm has been quiet for a long time. Shall we give it a fresh start?','We’re inside! Our first visitors need a welcome. I’ll show you how to write one.','Your words will be our visitors’ first welcome. What would you like to say?','Look—your message is here! You told Python what to display.','Your turn without the starter line. I’m here if you need a hint.','Two messages, written by you. Next, we can give our farm its own name.'];
function textBoard(){let chars=[...message];let first=chars.slice(0,25).join(''),second=chars.slice(25,50).join('');$('message').textContent=first;$('message2').textContent=second}
function render(){const c=$('content');$('progress').textContent=`OPENING · ${step+1} OF 6`;$('back').disabled=step===0;$('mochiWords').textContent=words[step];$('mochi').setAttribute('x',step===0?'799':'850');$('mochi').setAttribute('y',step===0?'631':'460');$('board').style.opacity=step>=3?'1':'.7';if(step<3){$('message').textContent='Your welcome goes here';$('message2').textContent=''}else textBoard();
if(step===0)c.innerHTML=`<div class="kicker">YOUR FIRST-DAY MISSION</div><h1>Give this little farm<br>a fresh start.</h1><p>Help Mochi prepare for the first morning. We’ll begin with one small welcome, then build from there.</p><div class="goals"><div class="goal"><span>1</span>Welcome your first visitors</div><div class="goal"><span>2</span>Give your farm a name</div><div class="goal"><span>3</span>Prepare its first growing area</div></div><p>You don’t need to know any Python yet. We’ll explain each new idea before you try it.</p><button class="primary" id="continue">Let’s begin →</button>`;
if(step===1)c.innerHTML=`<div class="kicker">FIRST, ONE SMALL IDEA</div><h1>Tell Python what<br>to display.</h1><p><strong>print()</strong> displays a message. In our game, that output also appears on this welcome board.</p><div class="example"><span style="color:#bad4a1">print</span><span>(</span><span style="color:#f2ce86">"Welcome!"</span><span>)</span></div><div class="explain"><div><strong>print</strong> — display something</div><div><strong>( )</strong> — put the message inside</div><div><strong>" "</strong> — these quotes mark text</div></div><p>This is an example, not your answer. You’ll choose your own welcome next.</p><button class="primary" id="continue">I’m ready to try →</button>`;
if(step===2||step===4){c.innerHTML=`<div class="kicker">${step===2?'TRY WITH A LITTLE HELP':'TRY IT YOURSELF'}</div><h1>${step===2?'Write your welcome.':'A second welcome,<br>all yours.'}</h1><div class="task"><strong>YOUR GOAL</strong><p>${step===2?'Replace the three dots with a welcome message. Keep the quotation marks and parentheses.':'Write a new print statement from scratch with a different welcome message.'}</p></div><label class="field" for="code">YOUR PYTHON</label><textarea id="code" spellcheck="false"></textarea><button class="primary" id="run">Run ▶</button><div class="error" id="error" role="status"></div><button class="secondary" id="hint">${step===2?'Show the example':'Need a hint?'}</button><div id="help"></div>`;$('code').value=step===2?draft:freeDraft;$('code').oninput=e=>{if(step===2)draft=e.target.value;else freeDraft=e.target.value};$('run').onclick=run;$('hint').onclick=()=>{$('help').textContent=step===2?'Example: print("Welcome!"). Choose your own words inside the quotes.':'Begin with lowercase print, put your quoted message inside parentheses: print("your message").'};}
if(step===3)c.innerHTML=`<div class="kicker">YOUR CODE, YOUR RESULT</div><h1>You wrote our<br>first welcome!</h1><div class="success"><strong>✓ First welcome complete</strong><p>Your message appears on the board because this game shows print output there.</p></div><p>You chose the text. Python displayed it. The quotation marks told Python which part was the message.</p><div class="task"><strong>WHAT WOULD CHANGE?</strong><p>If you change only the words inside the quotes, what do you expect to happen?</p></div><button class="primary" id="continue">Try another message →</button>`;
if(step===5)c.innerHTML=`<div class="kicker">FIRST SMALL MISSION COMPLETE</div><h1>Your farm has<br>a voice.</h1><div class="success"><strong>✓ You wrote a print statement without a starter.</strong><p>You used parentheses and quotes to display your own text.</p></div><p>Next proposed activity: choose a farm name and learn how a variable remembers it.</p><p>This preview ends here. Nothing in your published lesson has changed.</p><button class="primary" id="again">Try a different message</button>`;
$('continue')?.addEventListener('click',()=>{step++;render()});$('again')?.addEventListener('click',()=>{step=4;freeDraft='';render()});document.querySelector('.panel').scrollTop=0;}
function run(){let code=$('code').value.trim();const match=code.match(/^print\s*\(\s*(?:"([^"\\\r\n]*)"|'([^'\\\r\n]*)')\s*\)$/);if(!match){$('error').textContent=/^Print\b/.test(code)?'Use lowercase print. Python treats Print and print as different names.':'Try one print statement with your message inside quotes and parentheses, like print("Hello!").';return}let value=match[1]??match[2];if(!value.trim()||value==='...'){$('error').textContent='Choose your own welcome words to put between the quotes.';return}if([...value].length>50){$('error').textContent='For this preview board, keep the message to 50 characters or fewer.';return}if(step===4&&value===message){$('error').textContent='Try different words this time so you can see what changes.';return}message=value;step=step===2?3:5;render()}
$('back').onclick=()=>{if(step>0){step--;render()}};$('restart').onclick=()=>{step=0;message='';draft='print("...")';freeDraft='';render()};render();
</script></html>
